# Allow traffic by privileged group (used by daemon)
#
# Scoped to exclude the tunnel interface.  A pf rule carrying a user/group
# clause makes the kernel call pf_socket_lookup() for every packet that reaches
# it, and that takes tcbinfo.ipi_lock.  On the tunnel output path it does so
# while a socket lock is already held, which is the reverse of the order taken
# by tcp_gc() -> in_pcbdispose() -> sofreelastref(), and the two deadlock.
#
# The exemption is only needed so the daemon can escape 100.blockAll on the
# physical interface.  Traffic on the tunnel is already passed by
# 200.allowVPN, so excluding the tunnel here costs nothing.
#
# $interface is lo0 when there is no tunnel (see mac_firewall.cpp).  lo0 is
# "set skip"ped by 000.allowLoopback, so that case behaves as it did before.
pass out on ! $interface proto { tcp, udp } group {{BRAND_CODE}}vpn flags any no state
